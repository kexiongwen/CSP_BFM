[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-jax"
version = "0.1.0"
description = "JAX Gibbs sampler for the Bayesian cumulative shrinkage process factor model, with a sklearn-style estimator and RSP factor-switching post-processing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
# jax>=0.4.36: the RSP default polar backend uses
# jax.lax.linalg.qdwh and jax.default_matmul_precision; do not lower this
# floor without checking that those APIs exist in the candidate version.
dependencies = ["jax>=0.4.36", "numpy"]

[project.optional-dependencies]
ess = ["arviz>=1.3"]
rsp = ["optax>=0.2.8"]

[tool.setuptools]
packages = ["CSP_JAX", "CSP_JAX._rsp", "CSP_JAX._rsp.core", "CSP_JAX._rsp.kernels"]
